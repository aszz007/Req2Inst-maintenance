name: Documentation issue
description: Report missing, inaccurate, or unclear documentation
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: Document or location
      placeholder: README.md, docs/reproducibility.md, a command help string, etc.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, inaccurate, outdated, or unclear?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or proposed wording
      description: Link the relevant code/configuration or suggest a correction.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require changing model or experiment behavior.
          required: true
