name: Bug report
description: Report a reproducible defect in Req2Inst
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include private datasets, model weights, credentials, browser profiles, or unpublished paper material.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: A concise description of the defect.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The Git commit SHA used for the run.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, CUDA, GPU, PyTorch, Transformers, PEFT, and bitsandbytes versions.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command and relevant non-sensitive arguments.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Remove private paths, tokens, and sensitive data first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private or non-redistributable material.
          required: true
        - label: This is not a security vulnerability.
          required: true
