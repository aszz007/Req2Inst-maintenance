name: Feature request
description: Propose a scoped improvement to Req2Inst
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What research or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change and affected components.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Primary scope
      options:
        - Documentation or repository hygiene
        - Behavior-preserving refactoring
        - Training or model configuration
        - Routing or inference
        - Evaluation or experiments
        - Data or artifact release
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How should maintainers verify that stability and research claims are preserved?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and compatibility
      description: Note output, checkpoint, cache, dataset, GPU, or reproducibility impact.
