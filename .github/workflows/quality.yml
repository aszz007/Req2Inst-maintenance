name: Repository quality

on:
  push:
    branches:
      - main
      - "maintenance/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lightweight quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile project sources
        run: python -m compileall -q config models src scripts

      - name: Run syntax-focused Ruff checks
        run: python -m ruff check --select E9 .
