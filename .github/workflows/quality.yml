name: Repository quality

on:
  push:
    branches:
      - main
      - "maintenance/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lightweight quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Parse tracked Python files and validate documentation links
        run: >-
          python -m pytest -q
          tests/test_repository_quality.py
          tests/test_manuscript_terminology.py
          tests/test_model_compatibility.py
          tests/test_training_launcher_project_root.py
          tests/test_experiment_alignment.py
          tests/test_console_output.py
          -k "not config_exposes_only_supported_vision_version"

      - name: Run syntax-focused Ruff checks
        run: python -m ruff check --select E9 .
